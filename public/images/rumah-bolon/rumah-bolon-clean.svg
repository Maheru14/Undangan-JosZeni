<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-label="Ilustrasi vektor Rumah Bolon, rumah adat Batak" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="roofRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1410"/>
      <stop offset="0.6" stop-color="#6e251d"/>
      <stop offset="1" stop-color="#9a3a2c"/>
    </linearGradient>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="600" width="600" height="60">
      <rect x="0" y="600" width="600" height="60" fill="url(#fadeGrad)"/>
    </mask>
    <pattern id="beamDots" width="8" height="13" patternUnits="userSpaceOnUse">
      <rect x="2" y="5" width="4" height="3" fill="#140c09"/>
    </pattern>
    <g id="dotc"><circle r="3" fill="#d8b45f"/></g>
    <g id="sqc">
      <rect x="-3.5" y="-3.5" width="7" height="7" fill="none" stroke="#d8b45f" stroke-width="1.2"/>
      <path d="M0-3.5V3.5M-3.5 0H3.5" stroke="#d8b45f" stroke-width="1"/>
    </g>
    <g id="fanL" fill="none" stroke="#d8b45f" stroke-linecap="round">
      <path d="M116.9 416.5L266.8 146.9M127.4 422.3L277.3 152.7M137.8 428.4L287.8 158.6" stroke-width="1.5" opacity="0.85"/>
      <path d="M152.6 352.3L173.6 364M188.3 288.1L209.3 299.8M224 223.9L245 235.6" stroke-width="1.3" opacity="0.7"/>
    </g>
    <filter id="glow" x="-15%" y="-10%" width="130%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#d8b45f" flood-opacity="0.3"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== Dasar / refleksi ===== -->
    <g mask="url(#fade)">
      <rect x="102" y="608" width="396" height="12" fill="#140c09" stroke="#d8b45f" stroke-width="2.5"/>
      <rect x="102" y="608" width="396" height="12" fill="url(#beamDots)"/>
      <rect x="108" y="620" width="384" height="28" fill="none" stroke="#d8b45f" stroke-width="2"/>
      <g fill="#d8b45f">
        <path d="M176 624L185 636H180V644H172V636H167Z"/>
        <path d="M230 624L239 636H234V644H226V636H221Z"/>
        <path d="M372 624L381 636H376V644H368V636H363Z"/>
        <path d="M426 624L435 636H430V644H422V636H417Z"/>
        <rect x="275" y="625" width="50" height="19" opacity="0.6"/>
      </g>
    </g>

    <!-- ===== Kolong ===== -->
    <g fill="#d8b45f">
      <rect x="123" y="544" width="10" height="63"/><rect x="164" y="544" width="10" height="63"/>
      <rect x="202" y="544" width="10" height="63"/><rect x="245" y="544" width="10" height="63"/>
      <rect x="467" y="544" width="10" height="63"/><rect x="426" y="544" width="10" height="63"/>
      <rect x="388" y="544" width="10" height="63"/><rect x="345" y="544" width="10" height="63"/>
    </g>
    <g fill="#d8b45f" stroke="#140c09" stroke-width="1">
      <rect x="103" y="554" width="160" height="7"/><rect x="337" y="554" width="160" height="7"/>
      <rect x="103" y="581" width="160" height="7"/><rect x="337" y="581" width="160" height="7"/>
    </g>
    <path d="M271 544V607M329 544V607" stroke="#d8b45f" stroke-width="2.5"/>
    <rect x="273" y="546" width="54" height="61" fill="#5a1f18" stroke="#d8b45f" stroke-width="2"/>
    <path d="M273 555H327M273 564H327M273 573H327M273 582H327M273 591H327M273 600H327" stroke="#d8b45f" stroke-width="2.2"/>

    <!-- ===== Pita bermotif titik ===== -->
    <rect x="112" y="512" width="376" height="26" fill="#140c09" stroke="#d8b45f" stroke-width="3"/>
    <rect x="118" y="516" width="364" height="18" fill="none" stroke="#d8b45f" stroke-width="1.2"/>
    <use href="#dotc" x="135" y="525"/><use href="#sqc" x="155.6" y="525"/>
    <use href="#dotc" x="176.3" y="525"/><use href="#sqc" x="196.9" y="525"/>
    <use href="#dotc" x="217.5" y="525"/><use href="#sqc" x="238.1" y="525"/>
    <use href="#dotc" x="258.8" y="525"/><use href="#sqc" x="279.4" y="525"/>
    <use href="#dotc" x="300" y="525"/>
    <use href="#sqc" x="320.6" y="525"/><use href="#dotc" x="341.3" y="525"/>
    <use href="#sqc" x="361.9" y="525"/><use href="#dotc" x="382.5" y="525"/>
    <use href="#sqc" x="403.1" y="525"/><use href="#dotc" x="423.8" y="525"/>
    <use href="#sqc" x="444.4" y="525"/><use href="#dotc" x="465" y="525"/>

    <!-- ===== Dinding ===== -->
    <path d="M108 454H492L478 508H122Z" fill="#140c09" stroke="#d8b45f" stroke-width="4"/>
    <path d="M119 460L128 504M481 460L472 504" stroke="#d8b45f" stroke-width="3" fill="none"/>
    <g fill="#d8b45f">
      <path d="M168 462H184L183 482L176 506L169 482Z"/>
      <path d="M222 462H238L237 482L230 506L223 482Z"/>
      <path d="M362 462H378L377 482L370 506L363 482Z"/>
      <path d="M416 462H432L431 482L424 506L417 482Z"/>
    </g>
    <rect x="270" y="462" width="60" height="44" fill="#7f2a22" stroke="#d8b45f" stroke-width="3"/>

    <!-- ===== Interior atap ===== -->
    <path d="M300 42L78 441H522Z" fill="url(#roofRed)"/>
    <use href="#fanL"/>
    <use href="#fanL" transform="translate(600 0) scale(-1 1)"/>

    <!-- segitiga gable dalam -->
    <path d="M300 188L152 410H448Z" fill="#140c09"/>
    <path d="M300 188L152 410M300 188L448 410" stroke="#d8b45f" stroke-width="9" fill="none"/>
    <path d="M300 206L176 392M300 206L424 392" stroke="#d8b45f" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M300 236L222 350M300 236L378 350" stroke="#d8b45f" stroke-width="6" fill="none"/>

    <!-- tiang bubungan, palang, lingkaran -->
    <path d="M300 56V156M300 176V236" stroke="#d8b45f" stroke-width="4" fill="none"/>
    <path d="M236 170Q300 150 364 170" stroke="#d8b45f" stroke-width="5" fill="none"/>
    <circle cx="300" cy="164" r="9" fill="#d8b45f" stroke="#140c09" stroke-width="2"/>
    <circle cx="300" cy="164" r="3" fill="#b23a2e"/>

    <!-- matahari tengah -->
    <circle cx="300" cy="294" r="11" fill="#efe3c8"/>
    <path d="M268 306Q272 286 288 280M332 306Q328 286 312 280" stroke="#efe3c8" stroke-width="2.5" fill="none"/>

    <!-- susunan garis bertingkat -->
    <g stroke="#d8b45f" stroke-width="3" fill="none">
      <path d="M222 318H378M216 326H384M209 334H391M203 342H397"/>
    </g>

    <!-- langkan (balustrade) -->
    <rect x="198" y="349" width="204" height="5" fill="#d8b45f"/>
    <rect x="198" y="398" width="204" height="5" fill="#d8b45f"/>
    <g fill="#d8b45f">
      <rect x="204" y="355" width="6" height="42"/><rect x="217" y="355" width="6" height="42"/>
      <rect x="230" y="355" width="6" height="42"/><rect x="243" y="355" width="6" height="42"/>
      <rect x="256" y="355" width="6" height="42"/><rect x="269" y="355" width="6" height="42"/>
      <rect x="390" y="355" width="6" height="42"/><rect x="377" y="355" width="6" height="42"/>
      <rect x="364" y="355" width="6" height="42"/><rect x="351" y="355" width="6" height="42"/>
      <rect x="338" y="355" width="6" height="42"/><rect x="325" y="355" width="6" height="42"/>
    </g>
    <path d="M284 372L300 360L316 372L309 381L300 377L291 381Z" fill="#b23a2e" stroke="#d8b45f" stroke-width="1.6"/>
    <path d="M300 381L306 389L300 397L294 389Z" fill="#d8b45f"/>

    <!-- garis bawah gable -->
    <g stroke="#d8b45f" fill="none">
      <path d="M142 414H458" stroke-width="3"/>
      <path d="M128 424H472" stroke-width="3"/>
      <path d="M118 433H482" stroke-width="1.5"/>
    </g>

    <!-- ===== Balok bawah atap ===== -->
    <rect x="98" y="441" width="404" height="13" fill="#d8b45f"/>
    <rect x="98" y="441" width="404" height="13" fill="url(#beamDots)"/>
    <path d="M104 437H496M104 458H496" stroke="#d8b45f" stroke-width="1.5"/>

    <!-- ===== Tepi atap (pita tebal) ===== -->
    <path d="M62 470L300 42L538 470" fill="none" stroke="#d8b45f" stroke-width="22" stroke-linejoin="miter" stroke-linecap="round"/>
    <path d="M62 470L300 42L538 470" fill="none" stroke="#140c09" stroke-width="3" stroke-dasharray="2 9" opacity="0.7"/>
    <!-- kaki atap -->
    <path d="M40 450C30 478 50 494 84 490C108 488 122 476 126 462L100 446Z" fill="#d8b45f"/>
    <path d="M560 450C570 478 550 494 516 490C492 488 478 476 474 462L500 446Z" fill="#d8b45f"/>
  </g>
</svg>
